name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    name: quality-and-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile check
        run: |
          python -m py_compile \
            api/app.py \
            utils/preprocessing.py \
            utils/inference.py \
            utils/training.py \
            utils/evaluation.py \
            utils/settings.py \
            main.py

      - name: Lint (flake8)
        run: make lint

      - name: Format check (black / isort)
        run: make format-check

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=api \
            --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Coverage summary
        run: |
          test -f coverage.xml
          python -m coverage report --show-missing

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t fatocheck-api:ci .
